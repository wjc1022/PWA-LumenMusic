<!doctype html><meta charset="utf-8"><title>Silent diagnostics checks</title><iframe src="../index.html"></iframe><pre id="result"></pre>
<script type="module">
const frame=document.querySelector('iframe'),checks=[];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn){for(let i=0;i<300;i++){if(fn())return;await wait(20);}throw Error('timeout');}
function check(value,label){if(!value)throw Error(label);checks.push(label);}
try{
 await until(()=>frame.contentDocument.querySelector('#page-home .page-head'));
 const w=frame.contentWindow,d=w.document;
 const db=await w.eval('import("/src/database/db.js")'),engine=await w.eval('import("/src/services/audioEngine.js")');
 const diagnostics=await w.eval('import("/src/services/mediaDiagnostics.js")');
 const component=await w.eval('import("/src/components/mediaDiagnostics.js")');
 const bytes=new ArrayBuffer(44+16000*20),v=new DataView(bytes);
 function str(o,s){[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));}
 str(0,'RIFF');v.setUint32(4,bytes.byteLength-8,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,bytes.byteLength-44,true);
 const blob=new w.Blob([bytes],{type:'audio/wav'}),song={id:'diagnostic-a',title:'Diagnostic A',audioBlob:blob};
 await db.Songs.add(song);engine.audioEl.muted=true;await engine.selectSong(song,[song]);await until(()=>!engine.audioEl.paused&&engine.audioEl.readyState>=3);
 const source=engine.audioEl.src,position=engine.audioEl.currentTime,queue=engine.getQueue();
 let probePlay=0;const original=w.HTMLMediaElement.prototype.play;
 w.HTMLMediaElement.prototype.play=function(){if(this!==engine.audioEl){probePlay++;throw Error('probe must not play');}return original.call(this);};
 const panel=component.buildMediaDiagnostics();d.body.append(panel);await until(()=>panel.querySelector('select').options.length);
 check(panel.querySelector('select').value===song.id,'current track selected');
 panel.querySelectorAll('button')[0].click();await until(()=>JSON.parse(panel.querySelector('textarea').value).live?.recordExists);
 check(JSON.parse(panel.querySelector('textarea').value).live.audioBlob.head.bytesRead===64,'database partial read');
 panel.querySelectorAll('button')[1].click();await until(()=>JSON.parse(panel.querySelector('textarea').value).load?.status==='metadata-loaded');
 check(probePlay===0,'metadata probe never calls play');
 check(engine.audioEl.src===source&&!engine.audioEl.paused&&engine.audioEl.currentTime>=position&&engine.getQueue()===queue,'playing source transport and queue preserved');
 await db.Songs.replaceResource(song.id,'audioBlob',new w.Blob([]));panel.querySelectorAll('button')[0].click();await until(()=>JSON.parse(panel.querySelector('textarea').value).live?.audioBlob?.size===0);check(true,'check rereads latest database record');
 const probe=await diagnostics.probeMetadata(new w.Blob(['broken'],{type:'audio/wav'}),'audio');check(probe.status==='media-error','real invalid media error');
 check(await diagnostics.copyReport('x',{})===false,'copy fallback');
 const report=panel.querySelector('textarea').value;check(!report.includes('blob:'),'report omits temporary URL');
 const history=await w.eval('import("/src/services/mediaTimeline.js")');
 await until(()=>history.timeline(song.id).some(r=>r.operation==='resource-read'));
 panel.querySelectorAll('button')[2].click();await wait(40);
 check(JSON.parse(panel.querySelector('textarea').value).history.some(r=>r.songId===song.id&&r.op&&r.sessionId),'copy report includes committed timeline and ownership');
 const preferences=await w.eval('import("/src/services/playerPreferences.js")');
 await wait(100);
 const dbBefore=await db.Songs.withMedia(song.id),mode=[engine.isShuffleOn(),engine.getRepeatMode()];
 const nativeTransaction=w.IDBDatabase.prototype.transaction;let songWrites=0;
 w.IDBDatabase.prototype.transaction=function(stores,mode,...args){if(mode==='readwrite'&&[].concat(stores).includes('songs'))songWrites++;return nativeTransaction.call(this,stores,mode,...args);};
 for(const key of preferences.buttonKeys)preferences.setPlayerButtons({[key]:false});
 await wait(80);
 w.IDBDatabase.prototype.transaction=nativeTransaction;
 const dbAfter=await db.Songs.withMedia(song.id);
 check(songWrites===0&&engine.audioEl.src===source&&engine.isShuffleOn()===mode[0]&&engine.getRepeatMode()===mode[1],'button settings preserve media source, modes and issue no songs write');
 check(dbAfter.audioBlob.size===dbBefore.audioBlob.size&&dbAfter.playCount===dbBefore.playCount&&dbAfter.favorite===dbBefore.favorite,'button settings preserve stored media and metadata');
 const Broken=w.eval('(class extends Blob { slice(){throw new DOMException("missing", "NotFoundError");} })');
 history.traceRecord('readable',{id:'fault-probe',audioBlob:blob});
 await until(()=>history.timeline('fault-probe').some(r=>r.head?.readable));
 history.traceRecord('unreadable',{id:'fault-probe',audioBlob:new Broken(['x'])});
 await until(()=>history.timeline('fault-probe').some(r=>r.head?.error?.name==='NotFoundError'&&r.tail?.error?.name==='NotFoundError'));
 check(true,'browser evidence preserves readable to NotFoundError transition');
 const failure=await diagnostics.inspectRecord('db-error',async()=>{throw new w.DOMException('unavailable','UnknownError');});
 check(failure.databaseError.name==='UnknownError','browser database error stays distinct');
 const nativePut=w.IDBObjectStore.prototype.add;
 w.IDBObjectStore.prototype.add=function(value,...args){const request=nativePut.call(this,value,...args);if(value.id==='diagnostic-abort'){const transaction=this.transaction;request.addEventListener('success',()=>transaction.abort(),{once:true});}return request;};
 let abortError;try{await db.Songs.add({id:'diagnostic-abort',audioBlob:blob});}catch(error){abortError=error;}finally{w.IDBObjectStore.prototype.add=nativePut;}
 check(abortError?.name==='AbortError'&&!await db.Songs.withMedia('diagnostic-abort'),'real transaction abort after put success rejects and leaves no record');
 w.HTMLMediaElement.prototype.play=original;engine.audioEl.pause();
 const text='PASS '+checks.length+' diagnostics checks\n'+checks.join('\n');document.querySelector('#result').textContent=text;await fetch('/__result',{method:'POST',body:text});
}catch(error){await fetch('/__result',{method:'POST',body:'FAIL '+error.stack});}
</script>
