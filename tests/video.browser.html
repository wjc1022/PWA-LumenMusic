await wait(100);

tap(sub);await wait(100);check(w.getComputedStyle(d.querySelector('#lyricsBody')).display==='none'&&d.querySelector('#videoHost').getBoundingClientRect().width>vr.width,'subtitle off releases width');

pref.setPlayerButtons({});check(sub.getAttribute('aria-pressed')==='false','restoring button preserves subtitle state');
tap(sub);await wait(100);check(w.getComputedStyle(d.querySelector('#lyricsBody')).display!=='none','subtitle on restores sidebar');
const settings=await w.eval('import("/src/pages/settings.js")');
await settings.renderSettings(d.querySelector('#page-settings'),{});

engine.setShuffle(true);await engine.cycleRepeatMode();const mode=engine.getRepeatMode();
for(const key of pref.buttonKeys){
 const input=d.querySelector('[data-player-button="'+key+'"]');input.checked=false;input.dispatchEvent(new w.Event('change'));
 check(d.querySelector('#sheet'+ids[key]+'Btn').hidden&&!pref.getPlayerButtons()[key],'setting immediately hides and saves '+key);
}
check(d.querySelector('#shuffleBtn').hidden&&d.querySelector('#miniFavBtn').hidden,'mini buttons share visibility preferences');
check(engine.isShuffleOn()&&engine.getRepeatMode()===mode,'hidden shuffle/repeat keep active modes');
check(!d.querySelector('#sheetPrevBtn').hidden&&!d.querySelector('#sheetPlayBtn').hidden&&!d.querySelector('#sheetNextBtn').hidden,'base transport retained');
d.querySelector('#resetPlayerButtons').click();check(pref.buttonKeys.every(k=>pref.getPlayerButtons()[k]),'restore default visibility');
check(d.querySelector('#sheetVariantBtn').hidden,'default visibility cannot override video variant rule');
engine.setShuffle(false);while(engine.getRepeatMode()!=='off')await engine.cycleRepeatMode();
engine.audioEl.loop=true;engine.seekTo(0);await engine.audioEl.play();tap(d.querySelector('#videoHost'));
await wait(3250);check(modal.classList.contains('controls-hidden')&&d.querySelector('.player-sheet-controls').inert,'idle playing hides controls and exits focus order');
const playingBefore=!engine.audioEl.paused;tap(d.querySelector('#videoHost'));check(!modal.classList.contains('controls-hidden')&&!engine.audioEl.paused&&playingBefore,'tap wakes without toggling playback');

await engine.audioEl.play();tap(more);await wait(3150);check(!modal.classList.contains('controls-hidden'),'open more keeps controls visible');tap(more);
tap(d.querySelector('#sheetQueueBtn'));await wait(3150);check(!modal.classList.contains('controls-hidden'),'open queue keeps controls visible');tap(d.querySelector('#sheetQueueBtn'));
track.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,clientX:rect.left+rect.width*.5,pointerId:1,pointerType:'touch'}));await wait(3150);check(!modal.classList.contains('controls-hidden'),'drag keeps controls visible');track.dispatchEvent(new w.PointerEvent('pointercancel',{pointerId:1}));
track.focus();track.dispatchEvent(new w.KeyboardEvent('keydown',{bubbles:true,key:'ArrowRight'}));await wait(3150);check(!modal.classList.contains('controls-hidden'),'keyboard control focus keeps visible');
d.querySelector('#playerSheetClose').focus();tap(d.querySelector('#videoHost'));await wait(3150);check(modal.classList.contains('controls-hidden'),'after interaction ends idle timer restarts');
if(modal.classList.contains('page-fill')) tap(d.querySelector('#sheetFullscreenBtn'));
frame.style.width='390px';frame.style.height='844px';await wait(120);check(!modal.classList.contains('controls-hidden')&&w.getComputedStyle(d.querySelector('#lyricsBody')).display==='none','rotation cleans hidden state and portrait hides subtitles');
frame.style.width='568px';frame.style.height='320px';await wait(120);

check(desktopRow.right<=desktopPicture.right+2&&desktopRow.bottom<=desktopPicture.bottom,'desktop landscape overlay shares video boundary');

frame.style.width='1000px';frame.style.height='600px';await wait(100);
const bare=songs.find(s=>s.title==='local-video');await engine.selectSong(bare,songs);await until(()=>!d.querySelector('.lyric-line'),'no lyrics');check(w.getComputedStyle(d.querySelector('#lyricsBody')).display==='none','no lyrics gives video available width');

restored.setPlayerButtons({});const text='PASS '+checks.length+' video browser checks\n'+checks.join('\n');document.querySelector('#result').textContent=text;await fetch('/__result',{method:'POST',body:text});
}catch(e){const text='FAIL '+e.stack+'\n'+checks.join('\n');document.querySelector('#result').textContent=text;await fetch('/__result',{method:'POST',body:text});}
